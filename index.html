<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play with Masry</title>
<meta name="description" content="Games, songs and stories that teach kids Egyptian Arabic with Masry the Pharaoh Cat.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: an illustrated Giza scene fixed behind; a papyrus board on top that is either the level map (5 stages) or one game. One bright daytime look on purpose. */
:root{
  --sky-low:#bfe9f2; --papyrus:#fdf4dc; --papyrus-edge:#f0dfb2; --gold:#e8a91c; --gold-deep:#b97d0a;
  --lapis:#1d3f94; --lapis-deep:#132b66; --turq:#1fa39a; --ink:#3a2410; --muted:#7a6448;
  --good:#23985a; --bad:#d6453d;
  --c1:#23985a; --c2:#1fa39a; --c3:#e07b1a; --c4:#c2417a; --c5:#1d3f94;
  --display:"Baloo Bhaijaan 2","Trebuchet MS","Segoe UI",sans-serif;
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--sky-low);color:var(--ink);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;overflow-x:hidden}
button{font:inherit;color:inherit}
.scene{position:fixed;inset:0;z-index:0;pointer-events:none}
.scene svg{width:100%;height:100%;display:block}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ar{direction:rtl;unicode-bidi:isolate}
.emo{font-family:var(--emoji);font-weight:400}

header{display:flex;align-items:center;gap:10px}
.logo{display:flex;flex-direction:column;line-height:1;min-width:0}
.logo h1{margin:0;font-size:1.9rem;font-weight:800;color:#fff;text-shadow:0 3px 0 var(--lapis-deep),0 6px 14px rgba(19,43,102,.35);text-wrap:balance}
.logo h1 .ar{display:inline-block;color:var(--gold);margin-inline-start:6px}
.logo p{margin:6px 0 0;color:var(--lapis-deep);font-weight:700;font-size:.95rem}
.counters{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#fff7df,#f6dc96);border:3px solid var(--gold);border-radius:999px;padding:2px 12px 2px 8px;font-weight:800;font-size:1.1rem;color:var(--lapis-deep);box-shadow:0 3px 0 var(--gold-deep);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .emo{font-size:1.2rem}
.pill.pop{animation:pop .4s ease}
@keyframes pop{50%{transform:scale(1.2)}}

.board{position:relative;background:var(--papyrus);border-radius:28px;padding:16px;border:4px solid var(--gold);
  box-shadow:inset 0 0 0 4px var(--papyrus),inset 0 0 0 6px var(--lapis),0 8px 0 var(--gold-deep),0 18px 40px rgba(19,43,102,.3);display:flex;flex-direction:column;gap:14px}
.band{height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--lapis) 0 14px,var(--gold) 14px 20px,var(--turq) 20px 34px,var(--gold) 34px 40px)}
#view{display:flex;flex-direction:column;gap:14px}

/* map */
.hello{display:flex;align-items:flex-end;gap:14px}
.stage-h{display:flex;align-items:center;gap:10px;border-radius:18px;padding:8px 14px;color:#fff;background:var(--sc);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.stage-h .emo{font-size:1.7rem}
.stage-h b{font-size:1.35rem;line-height:1.1}
.stage-h small{font-weight:700;opacity:.95;font-size:.95rem}
.stage-h .cnt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.lvl{position:relative;border:3px solid var(--sc);background:#fff;border-radius:18px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 5px 0 var(--sc);transition:transform .12s,box-shadow .12s;min-width:0}
.lvl:hover{transform:translateY(-2px)}
.lvl:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sc)}
.lvl .n{position:absolute;top:-9px;left:-7px;min-width:26px;height:26px;border-radius:13px;background:var(--sc);color:#fff;font-weight:800;font-size:.9rem;display:grid;place-items:center;border:2px solid #fff;padding:0 5px}
.lvl .emo{font-size:1.9rem;line-height:1.15}
.lvl .t{font-size:.82rem;font-weight:800;line-height:1.15;text-align:center;color:var(--lapis-deep);min-height:2.3em;display:flex;align-items:center}
.lvl .st{font-size:.95rem;letter-spacing:1px;color:#e7d6ae;line-height:1}
.lvl .st i{font-style:normal}.lvl .st i.on{color:var(--gold)}
.lvl[disabled]{border-color:#d8cba6;box-shadow:0 5px 0 #d8cba6;background:#f6edd2;cursor:not-allowed}
.lvl[disabled] .n{background:#b9aa82}.lvl[disabled] .emo,.lvl[disabled] .t{opacity:.45}
.grown{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--muted);justify-content:center}
.grown input{width:20px;height:20px;accent-color:var(--lapis)}

/* play */
.topbar{display:flex;align-items:center;gap:10px}
.back{border:3px solid var(--gold);background:linear-gradient(180deg,#fffaf0,#f7e6bb);border-radius:999px;padding:4px 14px;font-weight:800;color:var(--lapis-deep);cursor:pointer;box-shadow:0 4px 0 var(--gold-deep);white-space:nowrap}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.ltitle{font-weight:800;font-size:1.05rem;color:var(--lapis-deep);min-width:0;line-height:1.15}
.ltitle small{display:block;font-size:.8rem;color:var(--muted)}
.stage{display:flex;align-items:flex-end;gap:14px}
.cat{width:170px;flex:none;transform-origin:50% 100%}
.cat img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 6px rgba(58,36,16,.25))}
.cat.happy{animation:hop .7s ease}.cat.sad{animation:wobble .6s ease}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px) rotate(-4deg)}65%{transform:translateY(0) scaleY(.94)}}
@keyframes wobble{25%{transform:rotate(-7deg)}75%{transform:rotate(5deg)}}
.bubble{position:relative;flex:1;min-width:0;background:#fff;border:4px solid var(--lapis);border-radius:24px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:2px;margin-bottom:34px;box-shadow:0 5px 0 var(--lapis-deep)}
.bubble::before{content:"";position:absolute;left:-20px;bottom:26px;border:12px solid transparent;border-right:16px solid var(--lapis)}
.bubble::after{content:"";position:absolute;left:-11px;bottom:29px;border:9px solid transparent;border-right:12px solid #fff}
.ask{font-size:.95rem;font-weight:700;color:var(--muted)}
.big{font-size:2.7rem;font-weight:800;line-height:1.2;color:var(--lapis);overflow-wrap:anywhere}
.big.en{font-size:1.7rem}
.big.pics{font-size:1.9rem;line-height:1.25;letter-spacing:2px}
.big .emo{font-size:3rem}
.tr{font-size:1.05rem;font-weight:700;color:var(--turq)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.say,.show{font-weight:800;border:0;border-radius:999px;background:linear-gradient(180deg,#ffcf4d,var(--gold));color:var(--lapis-deep);padding:6px 16px 6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--gold-deep)}
.show{background:#fff;border:3px solid var(--gold);padding:3px 14px;box-shadow:0 4px 0 var(--gold-deep)}
.say .emo{font-size:1.2rem}
.say:active,.show:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;border:4px solid var(--papyrus-edge);background:#fff;border-radius:22px;min-height:116px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);box-shadow:0 6px 0 var(--papyrus-edge);transition:transform .12s,box-shadow .12s,border-color .12s;min-width:0}
.opt:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 9px 0 var(--gold)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold)}
.disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;line-height:1;flex:none}
.disc.num{font-family:var(--display);font-weight:800;color:var(--lapis)}
.opt:nth-child(1) .disc{background:radial-gradient(circle at 35% 30%,#fff,#ffe1a6)}
.opt:nth-child(2) .disc{background:radial-gradient(circle at 35% 30%,#fff,#c8ecf7)}
.opt:nth-child(3) .disc{background:radial-gradient(circle at 35% 30%,#fff,#ffd3cf)}
.opt:nth-child(4) .disc{background:radial-gradient(circle at 35% 30%,#fff,#cdeedd)}
.opt .glyph{font-size:4rem;font-weight:800;line-height:1;color:var(--lapis);text-shadow:0 4px 0 #ffd77a}
.opt .word{font-size:2rem;font-weight:800;line-height:1.25;color:var(--lapis);text-align:center}
.opt .sub{font-size:.95rem;font-weight:700;color:var(--turq);text-align:center}
.opt .txt{font-size:1.15rem;font-weight:800;text-align:center;color:var(--lapis-deep);line-height:1.2}
.opt.small .disc{width:50px;height:50px;font-size:1.7rem}
.opt.right{border-color:var(--good);background:#eafaf0;box-shadow:0 6px 0 var(--good)}
.opt.right::after,.mcard.done::after{content:"✓";position:absolute;top:-12px;right:-10px;width:32px;height:32px;border-radius:50%;background:var(--good);color:#fff;font-weight:800;font-size:1.2rem;display:grid;place-items:center;border:3px solid #fff}
.opt.wrong{border-color:var(--bad);background:#fdeceb;box-shadow:0 6px 0 var(--bad);animation:shake .35s;opacity:.7}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{position:relative;aspect-ratio:3/4;border-radius:16px;border:3px solid var(--gold);cursor:pointer;display:grid;place-items:center;padding:4px;min-width:0;
  background:repeating-linear-gradient(45deg,var(--lapis) 0 10px,#2a52b8 10px 20px);box-shadow:0 5px 0 var(--lapis-deep);color:transparent}
.mcard::before{content:"?";color:var(--gold);font-weight:800;font-size:2rem}
.mcard.open,.mcard.done{background:#fff;color:var(--lapis);box-shadow:0 5px 0 var(--gold-deep)}
.mcard.open::before,.mcard.done::before{content:none}
.mcard .emo{font-size:2.3rem}
.mcard .word{font-size:1.35rem;font-weight:800;line-height:1.2;text-align:center}
.mcard.done{border-color:var(--good);background:#eafaf0}
.mcard:not(.open):not(.done) span{display:none}

/* sentence builder */
.line{min-height:66px;border:3px dashed var(--lapis);border-radius:18px;background:#fff;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;align-items:center}
.line.bad{border-color:var(--bad);animation:shake .35s}
.line.ok{border-color:var(--good);border-style:solid;background:#eafaf0}
.line:empty::before{content:"Tap the words in order";direction:ltr;color:var(--muted);font-weight:700;margin:auto}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl;min-height:60px}
.tile{border:3px solid var(--gold);background:linear-gradient(180deg,#fffaf0,#f7e6bb);border-radius:14px;padding:4px 16px;font-size:1.6rem;font-weight:800;color:var(--lapis);cursor:pointer;box-shadow:0 4px 0 var(--gold-deep)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}

.status{display:flex;align-items:center;gap:10px;min-height:30px;flex-wrap:wrap}
.stars{display:flex;gap:2px;flex-wrap:wrap}
.stars span{font-size:1.15rem;color:#e7d6ae;line-height:1}
.stars span.on{color:var(--gold);text-shadow:0 2px 0 var(--gold-deep)}
.msg{margin-left:auto;font-weight:800;font-size:1.15rem}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}

.win{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 8px}
.win .cat{width:210px}
.win h2{margin:0;font-size:2.1rem;color:var(--lapis);line-height:1.1}
.win h2 .ar{color:var(--gold-deep)}
.bigstars{font-size:2.8rem;letter-spacing:6px;color:#e7d6ae}
.bigstars span{display:inline-block}
.bigstars span.on{color:var(--gold);text-shadow:0 3px 0 var(--gold-deep);animation:starin .5s backwards}
.bigstars span:nth-child(2){animation-delay:.15s}.bigstars span:nth-child(3){animation-delay:.3s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.win p{margin:0;font-weight:700;color:var(--muted)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.primary{font-weight:800;border:0;border-radius:999px;background:linear-gradient(180deg,#2f5bc4,var(--lapis));color:#fff;padding:12px 28px;cursor:pointer;font-size:1.15rem;box-shadow:0 5px 0 var(--lapis-deep)}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lapis-deep)}

.confetti{position:fixed;width:10px;height:14px;border-radius:3px;pointer-events:none;z-index:50;animation:fly 900ms ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
button:focus-visible,input:focus-visible{outline:4px solid var(--turq);outline-offset:3px}

@media (max-width:460px){
  .logo h1{font-size:1.4rem}.logo p{display:none}.cat{width:118px}.big{font-size:2.1rem}.big.en{font-size:1.35rem}.big.pics{font-size:1.5rem}
  .opt{min-height:100px}.disc{width:58px;height:58px;font-size:2.1rem}.opt .glyph{font-size:3.2rem}.opt .word{font-size:1.6rem}
  .bubble{margin-bottom:22px;padding:10px 12px 12px}.levels{grid-template-columns:repeat(3,1fr)}
  .mgrid{gap:8px}.mcard .word{font-size:1.1rem}.mcard .emo{font-size:1.9rem}.tile{font-size:1.35rem;padding:4px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* site */
a{color:var(--lapis)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.navb{border:3px solid var(--gold);border-radius:18px;padding:6px 2px 4px;background:linear-gradient(180deg,#fffaf0,#f7e6bb);color:var(--lapis-deep);cursor:pointer;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 0 var(--gold-deep);min-width:0}
.navb .emo{font-size:1.5rem;line-height:1.15}
.navb b{font-size:.9rem;line-height:1.1}
.navb[aria-current="page"]{background:linear-gradient(180deg,#2f5bc4,var(--lapis));color:#fff;box-shadow:0 5px 0 var(--lapis-deep)}
.navb:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.sec{margin:4px 0 0;font-size:1.35rem;color:var(--lapis-deep);line-height:1.2;text-wrap:balance}
.sec small{font-size:.9rem;color:var(--muted);font-weight:700}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bigtile{border:0;border-radius:22px;padding:14px 6px 12px;background:var(--tc);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 6px 0 rgba(0,0,0,.22);min-width:0}
.bigtile .emo{font-size:2.6rem;line-height:1.1}
.bigtile b{font-size:1.6rem;line-height:1.2}
.bigtile span:last-child{font-size:.9rem;font-weight:700;text-align:center;line-height:1.2}
.bigtile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.primary.wide{align-self:stretch;text-align:center;text-decoration:none;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:3px solid var(--gold);border-radius:999px;padding:2px 12px;background:#fff;color:var(--lapis-deep);font-weight:800;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--lapis);color:#fff;border-color:var(--lapis)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.vcard{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:#fff;border:3px solid var(--papyrus-edge);border-radius:18px;padding:6px 6px 8px;box-shadow:0 5px 0 var(--papyrus-edge);min-width:0;transition:transform .12s,border-color .12s}
.vcard:hover{transform:translateY(-3px);border-color:var(--gold)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 60%),var(--tc)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb>.emo{font-size:3rem}
.playb{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;background:#d6453d;color:#fff;display:grid;place-items:center;font-size:.95rem;border:2px solid #fff;padding-left:2px}
.dur{position:absolute;left:6px;bottom:6px;background:rgba(19,43,102,.85);color:#fff;font-size:.8rem;font-weight:700;border-radius:8px;padding:0 6px;font-variant-numeric:tabular-nums}
.vcard b{font-size:1.15rem;line-height:1.3;color:var(--lapis);padding:2px 4px 0}
.vcard .ven{font-size:.9rem;font-weight:700;color:var(--muted);line-height:1.2;padding:0 4px}
.soon{margin:0;background:#fff;border:3px dashed var(--turq);border-radius:16px;padding:10px 14px;font-weight:700;color:var(--lapis-deep)}
.book{display:flex;gap:14px;align-items:center;background:#fff;border:3px solid var(--gold);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--gold-deep)}
.book .cat{width:120px}
.book h3{margin:0;font-size:1.25rem;color:var(--lapis);line-height:1.2}
.book p{margin:4px 0 10px;font-weight:700;color:var(--muted);line-height:1.35}
.prose{display:flex;flex-direction:column;gap:10px}
.prose h3{margin:6px 0 0;font-size:1.1rem;color:var(--lapis)}
.prose p,.prose li{margin:0;font-weight:500;line-height:1.5;font-size:1rem;max-width:62ch}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(19,43,102,.88);display:grid;place-items:center;padding:16px}
.modal .box{width:min(900px,100%);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.modal iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;background:#000}
.watch{text-decoration:none;display:inline-block}
@media (max-width:460px){.navb b{font-size:.72rem}.bigtile b{font-size:1.25rem}.bigtile .emo{font-size:2rem}.vgrid{grid-template-columns:1fr 1fr;gap:8px}.vcard b{font-size:1rem}.book{flex-direction:column;text-align:center}}
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb4d9"/><stop offset=".75" stop-color="#bfe9f2"/></linearGradient>
      <linearGradient id="pyrL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7cf7d"/><stop offset="1" stop-color="#e9ad4c"/></linearGradient>
      <linearGradient id="pyrR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c98a2c"/><stop offset="1" stop-color="#b37722"/></linearGradient>
      <linearGradient id="nile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a9fc8"/><stop offset="1" stop-color="#1a6f9c"/></linearGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#sky)"/>
    <circle cx="980" cy="150" r="90" fill="#ffe28a" opacity=".55"/>
    <circle cx="980" cy="150" r="62" fill="#ffd34d"/>
    <g fill="#fff" opacity=".85">
      <ellipse cx="220" cy="140" rx="70" ry="22"/><ellipse cx="270" cy="125" rx="45" ry="24"/>
      <ellipse cx="640" cy="90" rx="60" ry="18"/><ellipse cx="680" cy="78" rx="36" ry="20"/>
    </g>
    <polygon points="180,560 400,250 400,560" fill="url(#pyrL)"/><polygon points="400,250 620,560 400,560" fill="url(#pyrR)"/>
    <polygon points="560,560 720,330 720,560" fill="url(#pyrL)"/><polygon points="720,330 880,560 720,560" fill="url(#pyrR)"/>
    <polygon points="840,560 950,400 950,560" fill="url(#pyrL)"/><polygon points="950,400 1060,560 950,560" fill="url(#pyrR)"/>
    <polygon points="385,272 400,250 415,272" fill="#fff3c4"/>
    <path d="M0 540 Q300 500 600 545 T1200 530 L1200 800 L0 800 Z" fill="#f3c66b"/>
    <path d="M0 610 Q260 585 520 615 T1200 600 L1200 680 Q900 660 600 690 T0 680 Z" fill="url(#nile)"/>

const SENT = [

].map(([ar, en]) => ({ ar, en, w: ar.split(" ") }));

const STAGES = [

const FLAT = [];
STAGES.forEach((s, si) => s.levels.forEach(l => { l.id = FLAT.length; l.stage = si; FLAT.push(l); }));

/* ---------- state ---------- */
let save = { stars: {}, fish: 0, all: false };
try { const s = JSON.parse(localStorage.getItem("masryProgress") || "null"); if (s && s.stars) save = Object.assign(save, s); } catch (e) {}
const store = () => { try { localStorage.setItem("masryProgress", JSON.stringify(save)); } catch (e) {} };
const $ = id => document.getElementById(id);
const view = $("view");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = a => a[Math.floor(Math.random() * a.length)];
const totalStars = () => Object.values(save.stars).reduce((a, b) => a + b, 0);
const unlocked = id => save.all || id === 0 || (save.stars[id - 1] || 0) > 0;
function counters() { $("starCount").textContent = totalStars(); $("fishCount").textContent = save.fish; }

let arVoice = null;
function pickVoice() { if (!("speechSynthesis" in window)) return; const v = speechSynthesis.getVoices(); arVoice = v.find(x => /^ar[-_]EG/i.test(x.lang)) || v.find(x => /^ar/i.test(x.lang)) || null; }
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  try { if (!("speechSynthesis" in window) || !text) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = arVoice ? arVoice.lang : "ar-EG"; if (arVoice) u.voice = arVoice; u.rate = 0.8; speechSynthesis.speak(u);
  } catch (e) {}
}
const PRAISE = "أَحْسَنْتْ";

function burst(el) {
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, colors = ["#e8a91c", "#1d3f94", "#1fa39a", "#d6453d", "#ffd34d"];
  for (let i = 0; i < 18; i++) {
    const c = document.createElement("span"); c.className = "confetti";
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    c.style.left = cx + "px"; c.style.top = cy + "px"; c.style.background = colors[i % colors.length];
    c.style.setProperty("--dx", Math.cos(a) * d + "px"); c.style.setProperty("--dy", Math.sin(a) * d - 40 + "px"); c.style.setProperty("--r", (Math.random() * 540 - 270) + "deg");
    document.body.appendChild(c); setTimeout(() => c.remove(), 950);
  }
}
function feed() { save.fish++; store(); counters(); const fb = $("fishBox"); fb.classList.remove("pop"); void fb.offsetWidth; fb.classList.add("pop"); }
function catMood(m) { const c = $("cat"); if (!c) return; c.classList.remove("happy", "sad"); void c.offsetWidth; c.classList.add(m); }
function say(kind, html) { const m = $("msg"); if (m) { m.className = "msg " + kind; m.innerHTML = html; } }
const GOOD = '<span class="ar">أحسنتْ!</span> Well done!', BAD = '<span class="ar">حاول تاني</span> Try again';

/* ---------- map ---------- */
function showMap() {
  cur = null; counters();
  const max = FLAT.length * 3;
  let h = `<div class="hello"><div class="cat" id="cat">${CAT}</div><div class="bubble"><span class="ask">Masry says…</span><span class="big ar">أهلاً!</span><span class="tr">Pick a level. ${totalStars()} of ${max} stars so far.</span></div></div>`;
  STAGES.forEach((s, si) => {
    const got = s.levels.reduce((a, l) => a + (save.stars[l.id] || 0), 0);
    h += `<section style="--sc:var(${s.c});display:flex;flex-direction:column;gap:12px"><div class="stage-h"><span class="emo" aria-hidden="true">${s.icon}</span><div><b class="ar">${s.ar}</b> <small>Stage ${si + 1}: ${s.en}</small></div><span class="cnt">⭐ ${got}/${s.levels.length * 3}</span></div><div class="levels">`;
    s.levels.forEach(l => {
      const st = save.stars[l.id] || 0, open = unlocked(l.id);
      h += `<button class="lvl" id="lvl${l.id}" data-id="${l.id}" ${open ? "" : "disabled"} aria-label="Level ${l.id + 1}: ${l.title}${open ? "" : " (locked)"}"><span class="n">${l.id + 1}</span><span class="emo" aria-hidden="true">${open ? l.icon : "🔒"}</span><span class="t">${l.title}</span><span class="st" aria-hidden="true">${[1, 2, 3].map(i => `<i class="${i <= st ? "on" : ""}">★</i>`).join("")}</span></button>`;
    });
    h += `</div></section>`;
  });
  h += `<label class="grown" for="unlockAll"><input type="checkbox" id="unlockAll" ${save.all ? "checked" : ""}> Grown-ups: unlock every level</label>`;
  view.innerHTML = h;
  view.querySelectorAll(".lvl").forEach(b => b.onclick = () => startLevel(+b.dataset.id));
  $("unlockAll").onchange = e => { save.all = e.target.checked; store(); showMap(); };
}

/* ---------- play ---------- */
let cur = null;
const pool = l => l.pack.flatMap(p => PACKS[p]);
function startLevel(id) {
  const l = FLAT[id];
  cur = { l, qn: 0, mistakes: 0, total: l.n || (l.type === "build" ? 6 : l.type === "memory" ? 6 : 8), last: null };
  if (l.type === "build") cur.queue = shuffle(pool(l)).slice(0, cur.total);
  window.scrollTo(0, 0);
  if (l.type === "memory") renderMemory(); else next();
}
function topbar() {
  const l = cur.l, s = STAGES[l.stage];
  return `<div class="topbar"><button class="back" id="back">← Map</button><div class="ltitle">Level ${l.id + 1}: ${l.title}<small>Stage ${l.stage + 1}: ${s.en}</small></div></div>`;
}
function progress() { let s = ""; for (let i = 0; i < cur.total; i++) s += `<span class="${i < cur.qn ? "on" : ""}">★</span>`; return `<div class="status"><div class="stars" aria-label="${cur.qn} of ${cur.total} done">${s}</div><span class="msg" id="msg"></span></div>`; }
function wire() { $("back").onclick = showMap; }

const isDigit = o => /^\d+$/.test(o.em);
const optPic = o => `<span class="disc ${isDigit(o) ? "num" : "emo"}" aria-hidden="true">${o.em}</span><span class="txt">${o.en}</span>`;
const optWord = o => `<span class="word ar">${o.ar}</span><span class="sub">${o.tr}</span>`;
function four(p) { let ans; do { ans = rnd(p); } while (p.length > 4 && ans === cur.last); cur.last = ans; return { ans, opts: shuffle([ans, ...shuffle(p.filter(x => x !== ans && (x.en === undefined || x.en !== ans.en) && (x.em === undefined || x.em !== ans.em))).slice(0, 3)]) }; }

function makeQ() {
  const l = cur.l, p = pool(l); let type = l.type;
  if (type === "mix") type = Math.random() < 0.5 ? "pick" : "read";
  if (type === "count") {
    const n = 1 + Math.floor(Math.random() * 10), ans = p[n - 1], em = rnd(["🐟", "🍎", "⭐", "🐱", "🌹"]);
    return { ask: 'How many? <span class="ar">كام؟</span>', big: `<span class="big pics emo">${em.repeat(n)}</span>`, opts: shuffle([ans, ...shuffle(p.filter(x => x !== ans)).slice(0, 3)]).map(o => ({ o, html: optWord(o) })), ans, after: ans.ar };
  }
  const { ans, opts } = four(p);
  if (type === "pick") return { ask: "Masry says… tap the picture!", big: `<span class="big ar">${ans.ar}</span>`, tr: ans.tr, hear: ans.ar, opts: opts.map(o => ({ o, html: optPic(o) })), ans };
  if (type === "listen") return { ask: "Ears only! Listen and tap.", big: `<span class="big ar" id="hidden" hidden>${ans.ar}</span><span class="big emo" id="ear">🎧</span>`, hear: ans.ar, auto: true, reveal: true, opts: opts.map(o => ({ o, html: optPic(o) })), ans };
  if (type === "read") return { ask: "Which word is it?", big: `<span class="big ${isDigit(ans) ? "" : "emo"}">${ans.em}</span>`, tr: ans.en, opts: opts.map(o => ({ o, html: optWord(o) })), ans, after: ans.ar };
  if (type === "letter") return { ask: "Find the letter Masry says!", big: `<span class="big ar">${ans.ar}</span>`, tr: ans.tr, hear: ans.ar, opts: opts.map(o => ({ o, html: `<span class="glyph ar">${o.g}</span>` })), ans };
  if (type === "lname") return { ask: "What is this letter called?", big: `<span class="big ar">${ans.g}</span>`, opts: opts.map(o => ({ o, html: optWord(o) })), ans, after: ans.ar };
  if (type === "mean") return { ask: "What does Masry mean?", big: `<span class="big ar">${ans.ar}</span>`, tr: ans.tr, hear: ans.ar, small: true, opts: opts.map(o => ({ o, html: optPic(o) })), ans };
  return { ask: "How do you say it in Masry?", big: `<span class="big en"><span class="emo">${ans.em}</span> ${ans.en}</span>`, opts: opts.map(o => ({ o, html: optWord(o) })), ans, after: ans.ar };
}

function next() {
  if (cur.qn >= cur.total) return finish();
  if (cur.l.type === "build") return renderBuild();
  const q = cur.q = makeQ(); cur.locked = false;
  view.innerHTML = topbar() + `
    <div class="stage"><div class="cat" id="cat">${CAT}</div>
      <div class="bubble"><span class="ask">${q.ask}</span>${q.big}${q.tr ? `<span class="tr">${q.tr}</span>` : ""}
        <div class="row">${q.hear ? `<button class="say" id="say"><span class="emo" aria-hidden="true">🔊</span>Hear it</button>` : ""}${q.reveal ? `<button class="show" id="show">Show word</button>` : ""}</div>
      </div></div>
    <div class="grid">${q.opts.map((o, i) => `<button class="opt ${q.small ? "small" : ""}" id="opt${i}" data-i="${i}">${o.html}</button>`).join("")}</div>` + progress();
  wire();
  if (q.hear) $("say").onclick = () => speak(q.hear);
  if (q.reveal) $("show").onclick = () => { $("hidden").hidden = false; $("ear").hidden = true; };
  if (q.auto) speak(q.hear);
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.i, b));
}
function choose(i, btn) {
  if (cur.locked) return;
  const q = cur.q;
  if (q.opts[i].o === q.ans) {
    cur.locked = true; btn.classList.add("right"); cur.qn++; feed(); catMood("happy"); burst(btn); say("good", GOOD); speak(q.after || PRAISE);
    setTimeout(() => { if (cur) next(); }, 1200);
  } else { cur.mistakes++; btn.classList.add("wrong"); btn.disabled = true; catMood("sad"); say("bad", BAD); }
}

/* sentence builder */
function renderBuild() {
  const s = cur.queue[cur.qn]; cur.locked = false; cur.placed = [];
  let tiles = shuffle(s.w.map((w, i) => ({ w, i }))); if (tiles.every((t, i) => t.i === i)) tiles.reverse();
  cur.tiles = tiles;
  view.innerHTML = topbar() + `
    <div class="stage"><div class="cat" id="cat">${CAT}</div>
      <div class="bubble"><span class="ask">Build the sentence in Masry</span><span class="big en">${s.en}</span></div></div>
    <div class="line" id="line"></div><div class="tiles" id="tiles"></div>` + progress();
  wire(); drawBuild();
}
function drawBuild() {
  const s = cur.queue[cur.qn];
  $("line").innerHTML = cur.placed.map((t, k) => `<button class="tile" data-k="${k}">${t.w}</button>`).join("");
  $("tiles").innerHTML = cur.tiles.filter(t => !cur.placed.includes(t)).map(t => `<button class="tile" data-i="${t.i}">${t.w}</button>`).join("");
  $("tiles").querySelectorAll(".tile").forEach(b => b.onclick = () => { if (cur.locked) return; const t = cur.tiles.find(x => x.i === +b.dataset.i); cur.placed.push(t); speak(t.w); drawBuild(); checkBuild(); });
  $("line").querySelectorAll(".tile").forEach(b => b.onclick = () => { if (cur.locked) return; cur.placed.splice(+b.dataset.k, 1); drawBuild(); });
}
function checkBuild() {
  const s = cur.queue[cur.qn]; if (cur.placed.length < s.w.length) return;
  const line = $("line");
  if (cur.placed.map(t => t.w).join(" ") === s.ar) {
    cur.locked = true; line.classList.add("ok"); cur.qn++; feed(); catMood("happy"); burst(line); say("good", GOOD); speak(s.ar);
    setTimeout(() => { if (cur) next(); }, 2200);
  } else {
    cur.locked = true; cur.mistakes++; line.classList.add("bad"); catMood("sad"); say("bad", BAD);
    setTimeout(() => { if (!cur) return; cur.locked = false; cur.placed = []; drawBuild(); $("line").classList.remove("bad"); }, 800);
  }
}

/* memory */
function renderMemory() {
  const words = shuffle(pool(cur.l)).slice(0, cur.total);
  cur.cards = shuffle(words.flatMap(w => [{ w, k: "p" }, { w, k: "w" }])); cur.open = []; cur.done = 0; cur.locked = false;
  view.innerHTML = topbar() + `
    <div class="stage"><div class="cat" id="cat">${CAT}</div>
      <div class="bubble"><span class="ask">Memory match</span><span class="big en">Find each picture and its Masry word</span></div></div>
    <div class="mgrid">${cur.cards.map((c, i) => `<button class="mcard" id="mc${i}" data-i="${i}" aria-label="Card ${i + 1}">${c.k === "p" ? `<span class="${isDigit(c.w) ? "word" : "emo"}">${c.w.em}</span>` : `<span class="word ar">${c.w.ar}</span>`}</button>`).join("")}</div>
    <div class="status"><div class="stars" id="mstars"></div><span class="msg" id="msg"></span></div>`;
  wire(); memStars();
  view.querySelectorAll(".mcard").forEach(b => b.onclick = () => flip(+b.dataset.i));
}
function memStars() { let s = ""; for (let i = 0; i < cur.total; i++) s += `<span class="${i < cur.done ? "on" : ""}">★</span>`; $("mstars").innerHTML = s; }
function flip(i) {
  const el = $("mc" + i), c = cur.cards[i];
  if (cur.locked || el.classList.contains("open") || el.classList.contains("done")) return;
  el.classList.add("open"); cur.open.push(i); if (c.k === "w") speak(c.w.ar);
  if (cur.open.length < 2) return;
  const [a, b] = cur.open, A = $("mc" + a), B = $("mc" + b);
  if (cur.cards[a].w === cur.cards[b].w) {
    cur.open = []; cur.done++; cur.qn = cur.done; [A, B].forEach(x => { x.classList.remove("open"); x.classList.add("done"); });
    feed(); catMood("happy"); burst(B); say("good", GOOD); memStars(); speak(c.w.ar);
    if (cur.done >= cur.total) setTimeout(() => { if (cur) finish(); }, 1200);
  } else {
    cur.locked = true; cur.mistakes++; catMood("sad"); say("bad", BAD);
    setTimeout(() => { if (!cur) return; A.classList.remove("open"); B.classList.remove("open"); cur.open = []; cur.locked = false; }, 1000);
  }
}

function finish() {
  const l = cur.l, mem = l.type === "memory", m = cur.mistakes;
  const stars = mem ? (m <= 4 ? 3 : m <= 8 ? 2 : 1) : (m === 0 ? 3 : m <= 2 ? 2 : 1);
  save.stars[l.id] = Math.max(save.stars[l.id] || 0, stars); store(); counters();
  const nx = FLAT[l.id + 1], lastOne = !nx, newStage = nx && nx.stage !== l.stage;
  view.innerHTML = `<div class="win"><div class="cat happy" id="wincat">${CAT}</div>
    <h2><span class="ar">${lastOne ? "مبروك!" : "شاطر!"}</span> ${lastOne ? "You are a Masry Master!" : "Great job!"}</h2>
    <div class="bigstars" aria-label="${stars} of 3 stars">${[1, 2, 3].map(i => `<span class="${i <= stars ? "on" : ""}">★</span>`).join("")}</div>
    <p>${stars === 3 ? "Perfect! No mistakes." : stars === 2 ? "So close. Play again for 3 stars." : "Good try. Play again to earn more stars."}</p>
    ${newStage ? `<p>New stage unlocked: <b>${STAGES[nx.stage].en}</b> <span class="ar">${STAGES[nx.stage].ar}</span></p>` : ""}
    <div class="btns">${nx ? `<button class="primary" id="nextBtn">Next level →</button>` : ""}<button class="back" id="again">Play again</button>${SONG[l.pack[0]] ? `<a class="back watch" href="${yt(SONG[l.pack[0]])}" target="_blank" rel="noopener" data-v="${SONG[l.pack[0]]}">🎬 Watch the song</a>` : ""}<button class="back" id="back">← Map</button></div></div>`;
  speak(lastOne ? "مبروك" : "شاطر"); burst($("wincat"));
  $("back").onclick = showMap; $("again").onclick = () => startLevel(l.id); wireVideos();
  if (nx) $("nextBtn").onclick = () => startLevel(nx.id);
  cur = { l, done: true };
}

function vcard(v) {

}
function wireVideos() { view.querySelectorAll("[data-v]").forEach(a => a.onclick = e => { if (!canEmbed) return; e.preventDefault(); openPlayer(a.dataset.v); }); }
function openPlayer(id) {
  closePlayer();
  const m = document.createElement("div"); m.className = "modal"; m.id = "player";
  m.innerHTML = `<div class="box"><button class="back" id="closeP">✕ Close</button><iframe title="Video player" src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>`;
  m.onclick = e => { if (e.target === m) closePlayer(); };
  document.body.appendChild(m); $("closeP").onclick = closePlayer; $("closeP").focus();
}
function closePlayer() { const m = $("player"); if (m) m.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closePlayer(); });
